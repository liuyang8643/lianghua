<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WBR 数据覆盖度</title>
<style>
:root{--bg:#f4f7fb;--ink:#132238;--muted:#718096;--line:#e5ebf2;--blue:#2563eb;--teal:#0f9f8f;--amber:#e49a35;--card:#fff;--red:#d95d5d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Microsoft YaHei",sans-serif;font-size:14px}.shell{max-width:1440px;margin:auto;padding:28px 34px 42px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.08em;font-size:11px}.title{font-size:28px;margin:7px 0 6px}.sub{color:var(--muted);margin:0}.stamp{text-align:right;color:var(--muted);font-size:12px}.stamp strong{display:block;color:var(--teal);font-size:13px;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:7px;box-shadow:0 2px 8px #183b5b08}.card{padding:18px 19px}.metric-label,.panel-note,.foot{color:var(--muted);font-size:12px}.metric{font-size:27px;font-weight:750;margin:11px 0 4px}.delta{font-size:12px;color:var(--teal)}.delta.warn{color:var(--red)}.panel{padding:20px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel h2{font-size:16px;margin:0}.controls{display:flex;gap:4px;background:#f3f6fa;padding:3px;border-radius:5px}.controls button{border:0;background:transparent;padding:6px 11px;color:var(--muted);border-radius:4px;cursor:pointer;font:inherit}.controls button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #102a430f}.chart-wrap{height:300px;position:relative}.chart-wrap canvas{width:100%;height:100%}.legend{display:flex;gap:18px;align-items:center;font-size:12px;color:var(--muted);margin-top:12px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.lower{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.bar-row{display:grid;grid-template-columns:115px 1fr 55px;align-items:center;gap:10px;margin:15px 0;font-size:12px}.bar-track{height:8px;background:#edf1f6;border-radius:3px;overflow:hidden}.bar{height:100%;border-radius:3px}.insight{border-left:3px solid var(--teal);padding:11px 0 11px 14px;margin:12px 0;color:#425466;line-height:1.6}.insight b{color:var(--ink)}.foot{margin-top:17px;font-size:11px}@media(max-width:900px){.shell{padding:22px 16px}.top{display:block}.stamp{text-align:left;margin-top:14px}.grid{grid-template-columns:repeat(2,1fr)}.lower{grid-template-columns:1fr}.chart-wrap{height:250px}}@media(max-width:540px){.metric{font-size:22px}.bar-row{grid-template-columns:83px 1fr 45px}.panel{padding:16px}.title{font-size:23px}}
</style>
</head>
<body><main class="shell">
<header class="top"><div><div class="eyebrow">WBR / DATA QUALITY</div><h1 class="title">财务数据覆盖度</h1><p class="sub">每日可用股票数，与 K 线完整性的同步观察</p></div><div class="stamp"><strong>本地快照</strong><span id="source">正在加载数据...</span></div></header>
<section class="grid"><article class="card"><div class="metric-label">最新 K 线可用</div><div class="metric" id="klineCount">-</div><div class="delta">交易日记录</div></article><article class="card"><div class="metric-label">财务记录可用</div><div class="metric" id="financialCount">-</div><div class="delta">按报告期统计</div></article><article class="card"><div class="metric-label">EPS 可用</div><div class="metric" id="epsCount">-</div><div class="delta">关键字段非空</div></article><article class="card"><div class="metric-label">K 线 - 财务缺口</div><div class="metric" id="gapCount">-</div><div class="delta warn">需关注数据对齐</div></article></section>
<section class="panel"><div class="panel-head"><div><h2>覆盖度趋势</h2><div class="panel-note">统计窗口：2000-01-01 起的全部可用交易日</div></div><div class="controls"><button class="active" data-mode="count">股票数</button><button data-mode="ratio">财务 / K 线</button></div></div><div class="chart-wrap"><canvas id="chart"></canvas></div><div class="legend"><span><i class="dot" style="background:#2563eb"></i>K 线</span><span><i class="dot" style="background:#0f9f8f"></i>财务记录</span><span><i class="dot" style="background:#e49a35"></i>EPS</span></div></section>
<section class="lower"><section class="panel"><div class="panel-head"><h2>最新截面</h2><span class="panel-note" id="latestDate">-</span></div><div class="bar-row"><span>K 线</span><div class="bar-track"><div class="bar" id="barK" style="background:#2563eb"></div></div><b id="barKLabel">-</b></div><div class="bar-row"><span>财务记录</span><div class="bar-track"><div class="bar" id="barF" style="background:#0f9f8f"></div></div><b id="barFLabel">-</b></div><div class="bar-row"><span>EPS 非空</span><div class="bar-track"><div class="bar" id="barE" style="background:#e49a35"></div></div><b id="barELabel">-</b></div></section><section class="panel"><div class="panel-head"><h2>读数</h2><span class="panel-note">当前口径</span></div><div class="insight" id="insight">正在生成分析...</div><div class="foot">财务线来自 deep_indicators，按报告期统计；它适合看数据覆盖度，不等同于严格 point-in-time 可交易口径。</div></section></section>
</main><script src="data.js"></script>
<script>
const fmt=n=>new Intl.NumberFormat('zh-CN').format(n);let rows=[],mode='count';
async function init(){const data=window.WBR_DATA||await fetch('data.json').then(r=>r.json()),last=data.rows.at(-1);rows=data.rows;document.querySelector('#source').textContent=`数据更新于 ${data.generated_at.replace('T',' ')}`;document.querySelector('#klineCount').textContent=fmt(last.kline);document.querySelector('#financialCount').textContent=fmt(last.financial);document.querySelector('#epsCount').textContent=fmt(last.eps);document.querySelector('#gapCount').textContent=fmt(last.kline-last.financial);document.querySelector('#latestDate').textContent=last.date;const max=last.kline;[['barK',last.kline,'barKLabel'],['barF',last.financial,'barFLabel'],['barE',last.eps,'barELabel']].forEach(([id,n,label])=>{document.getElementById(id).style.width=`${n/max*100}%`;document.getElementById(label).textContent=fmt(n)});document.querySelector('#insight').innerHTML=`最新交易日有 <b>${fmt(last.kline)} 只</b> 股票有 K 线，财务记录覆盖 <b>${(last.financial/last.kline*100).toFixed(1)}%</b>；其中 EPS 可用 <b>${(last.eps/last.kline*100).toFixed(1)}%</b>。看板重点是识别“行情可交易、财务不可用”的缺口。`;draw()}
function draw(){const c=document.querySelector('#chart'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const pad={l:44,r:18,t:14,b:28},iw=w-pad.l-pad.r,ih=h-pad.t-pad.b,step=Math.max(1,Math.floor(rows.length/150)),visible=rows.filter((_,i)=>i%step===0),vals=mode==='ratio'?visible.flatMap(r=>[r.financial/r.kline*100,r.eps/r.kline*100]):visible.flatMap(r=>[r.kline,r.financial,r.eps]),min=mode==='ratio'?Math.min(...vals)-2:Math.min(...vals)-80,max=Math.max(...vals)+80,y=v=>pad.t+ih-(v-min)/(max-min)*ih,xx=i=>pad.l+i/(visible.length-1)*iw;x.font='11px Microsoft YaHei';x.strokeStyle='#e7edf4';x.fillStyle='#718096';x.textAlign='right';for(let i=0;i<5;i++){const v=min+(max-min)*i/4,py=y(v);x.beginPath();x.moveTo(pad.l,py);x.lineTo(w-pad.r,py);x.stroke();x.fillText(mode==='ratio'?`${v.toFixed(0)}%`:fmt(Math.round(v)),pad.l-9,py+4)}x.textAlign='center';visible.forEach((r,i)=>{if(i%Math.max(1,Math.floor(visible.length/5))===0)x.fillText(r.date.slice(0,7),xx(i),h-8)});const series=mode==='ratio'?[[r=>r.financial/r.kline*100,'#0f9f8f'],[r=>r.eps/r.kline*100,'#e49a35']]:[[r=>r.kline,'#2563eb'],[r=>r.financial,'#0f9f8f'],[r=>r.eps,'#e49a35']];series.forEach(([fn,color])=>{x.strokeStyle=color;x.lineWidth=2;x.beginPath();visible.forEach((r,i)=>{const px=xx(i),py=y(fn(r));i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
document.querySelectorAll('.controls button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.controls button').forEach(q=>q.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;draw()});window.onresize=draw;init();
</script></body></html>
