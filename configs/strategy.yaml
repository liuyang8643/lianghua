version: "2026-06-19"
default_profile: ga7_clean

strategy_parameters:
  - {key: buy_n, config_key: buy_n, type: int, display: buy, default: 20}
  - {key: sell_m, config_key: sell_m, type: int, display: sell, default: null}
  - {key: stock_pool, config_key: stock_pool, type: stock_pool, display: pool, default: ["60", "00", "30", "688"]}
  - {key: holding_period, config_key: holding_period, type: int, display: hp, default: 1}
  - {key: timing_base, config_key: timing_base, type: float, display: t_base, default: null}
  - {key: timing_leverage, config_key: timing_leverage, type: float, display: t_lev, default: null}
  - {key: timing_direction, config_key: timing_direction, type: int, display: t_dir, default: null}
  - {key: timing_window, config_key: timing_window, type: int, display: t_win, default: null}
  - {key: timing_index, config_key: timing_index, type: categorical, display: t_idx, default: null}
  - {key: amount_filter_pct, config_key: amount_filter_pct, type: int, display: amt%, default: 0}
  - {key: market_cap_filter_pct, config_key: market_cap_filter_pct, type: int, display: mcap%, default: 0}
  - {key: rebalance, config_key: rebalance, type: categorical, display: rebal, default: true}
  - {key: limit_up_protection, config_key: limit_up_protection, type: categorical, display: limup, default: false}
  - {key: cash_reserve_ratio, config_key: cash_reserve_ratio, type: float, display: cash%, default: 0}
  - {key: prefilter_enabled, config_key: prefilter_n, type: int, display: pref, default: 0}

mode_configs:
  single:
    population_size: 1
    generations: 1
    log_level: DEBUG
    save_charts: true
    desc: 单次回测模式
  debug:
    population_size: 2
    generations: 3
    log_level: DEBUG
    save_charts: false
    desc: 调试模式（最小GA）
  ga:
    population_size: 50
    generations: 10000
    log_level: INFO
    save_charts: false
    desc: GA优化模式（默认）

search_spaces:
  buy_n: {range: [5, 100, 5]}
  sell_m: {range: [5, 100, 5]}
  holding_period: [1, 3, 5, 7, 15, 30, 60]
  rebalance: [true, false]
  limit_up_protection: [true, false]
  cash_reserve_ratio: {range: [0.0, 1.0, 0.1]}
  prefilter_enabled: [0, 300]
  board_prefixes: ["60", "00", "30", "688"]
  timing_base: {range: [0.1, 1.0, 0.1]}
  timing_leverage: [0, 0.5, 1, 2, 3, 5, 8, 10, 12, 15, 20, 25, 30, 40, 50]
  timing_window: [2, 3, 5, 7, 10, 15, 20, 25, 30, 45, 60, 90, 120, 252]
  timing_direction: [1, -1]
  timing_index: [sh000300, sh000905, sh000852]

profiles:
  core:
    desc: 10因子 — 原6核心 + 增长价值质量GA
    factor_classes: [
      TrueMarketCap, AmountBasedSmallCap,
      AmihudIlliquidity, VolumeCV,
      High52Week,
      ProfitGrowth, CashFlowYield,
      Factor_20260531_005210_g17_4,
      Factor_20260531_005210_g41_0,
    ]
    weight_range: [-1.0, 1.0, 0.1]
    search_spaces: [buy_n]
    preload_start: 2010-01-01
    preload_end: 2018-12-31

