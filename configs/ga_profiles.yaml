version: "2026-05-19"
default_profile: smallcap_st

mode_configs:
  single:
    population_size: 1
    generations: 1
    period_span: 30
    log_level: DEBUG
    save_charts: true
    desc: 单次回测模式
  debug:
    population_size: 2
    generations: 3
    period_span: 30
    window_days: 60
    log_level: DEBUG
    save_charts: false
    desc: 调试模式（最小GA）
  ga:
    population_size: 50
    generations: 10000
    period_span: 250
    window_days: 250
    log_level: INFO
    save_charts: false
    desc: GA优化模式（默认）

search_spaces:
  position_count: [5, 15, 25, 35]
  board_prefixes: [60, 00, 30, 688]
  timing_sensitivity: [0.5, 0.75, 1.0, 1.5, 2.0]
  ma_period: [3, 7, 14, 21, 30, 60, 90, 120, 180]
  timing_direction: [1, -1]
  timing_index: [sh000300, sh000905, sh000852]
  timing_enabled: [true, false]

profiles:
  smallcap_st:
    desc: SmallCap-only GA profile
    factor_classes: [SmallCap]
    search_spaces: [position_count]
    preload_start: 2010-01-01
    preload_end: 2026-01-01

  reversal_st:
    desc: ShortTermReversal single-factor profile
    factor_classes: [ShortTermReversal]
    search_spaces: [position_count]
    preload_start: 2010-01-01
    preload_end: 2026-01-01

  cf_quality_st:
    desc: CashFlowQuality single-factor profile
    factor_classes: [CashFlowQuality]
    search_spaces: [position_count]
    preload_start: 2010-01-01
    preload_end: 2026-01-01

  smallcap_g2a_roe2x_bottom10:
    desc: SmallCapDailyMVMaskRoe2xBottom10 single-factor profile
    factor_classes: [SmallCapDailyMVMaskRoe2xBottom10]
    search_spaces: [position_count]
    preload_start: 2010-01-01
    preload_end: 2026-01-01

  tmc_g2a_timing:
    desc: TrueMarketCap 或 G2a(ROE×2) 单因子 + stock_pool + 大盘择时
    factor_classes: [TrueMarketCap, SmallCapDailyMVMaskRoe2xBottom10]
    factor_choice_space: [TrueMarketCap, SmallCapDailyMVMaskRoe2xBottom10]
    search_spaces: [position_count, stock_pool, factor_choice, timing_sensitivity, timing_direction, timing_enabled, ma_period, timing_index]
    preload_start: 2010-01-01
    preload_end: 2020-12-31
