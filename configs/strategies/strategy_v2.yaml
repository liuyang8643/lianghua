# WBR 策略配置文件 - 版本2
# 基于多技术指标的激进型策略

# ==================== 策略元信息 ====================
meta:
  name: "Aggressive Multi-Factor Strategy"
  version: "v2.0"
  description: "激进型多因子策略，启用6个技术指标，高温度参数，追求短期收益"
  created_at: "2025-12-14"
  author: "WBR"
  base_config: "base.yaml"
  changelog:
    - "2025-12-14: 初始版本，启用6个技术因子"
    - "2025-12-14: 提高温度参数，增强排名灵敏度"

# ==================== 因子配置 ====================
factors:
  # 趋势类因子 - 中等权重，中等温度
  MACD:
    enabled: true
    weight: 1.0
    temperature: 1.5

  BBI:
    enabled: true
    weight: 0.8
    temperature: 1.3

  # 动量类因子 - 较高权重，高温度
  RSI:
    enabled: true
    weight: 1.2
    temperature: 2.0  # 高温度，对超卖信号敏感

  KDJ:
    enabled: true
    weight: 1.0
    temperature: 2.2  # 高温度，灵敏捕捉短期信号

  MOM:
    enabled: true
    weight: 0.8
    temperature: 1.8

  # 波动类因子 - 中等权重，中等温度
  BollingerBands:
    enabled: true
    weight: 0.9
    temperature: 1.4

# ==================== 选股策略配置 ====================
selection:
  rank_n: 25  # 集中持仓，选取前25只

# ==================== 仓位管理配置 ====================
position:
  min_buy_amount: 15000  # 提高最小买入金额
  max_buy_amount: 30000  # 提高最大买入金额

# ==================== 资金配置 ====================
capital:
  initial_capital: 1000000
  max_position_ratio: 0.98  # 接近满仓

# ==================== 回测配置 ====================
backtest:
  start_date: "20240601"  # 较短的回测周期，关注近期表现
  end_date: "20241231"

# ==================== 遗传算法配置 ====================
genetic_algorithm:
  enabled: true
  population_size: 30
  generations: 50
