interface:
  display_name: "Git Session Commit"
  short_description: "Commit session files and rebase on upstream"
  default_prompt: "Use $git-session-commit to clear the staging area, commit only files changed in the current session with a Chinese summary, prefer rebase when syncing non-mainline branches with upstream, use merge when integrating work into the mainline branch, and escalate judgment-heavy conflicts to the user."
