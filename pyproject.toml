[project]
name = "wbr"
version = "1.0.0"
description = "WBR Trading System - 基于 QMT 的量化交易系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.14.0",
    "baostock~=0.9.3",
    "filelock~=3.20.3",
    "lark-oapi~=1.4.23",
    "loguru~=0.7.2",
    "matplotlib>=3.9,<4",
    "mini-racer~=0.12.4; sys_platform != 'linux'",
    "mootdx~=0.11.7",
    "numpy~=2.3.5",
    "pandas~=2.3.3",
    "psutil~=7.1.3",
    "pyarrow~=22.0.0",
    "pyyaml~=6.0",
    "stable-baselines3>=2.7,<3",
    "xtquant~=250516.1.1",
    "py-mini-racer~=0.6.0; sys_platform == 'linux'",
    "numba~=0.63.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "/ai/**/*.py",
    "/ai/report_assets/*",
    "/env/**/*.py",
    "/factor/**/*.py",
    "/offline_data/**/*.py",
    "/trade/**/*.py",
    "/utils/**/*.py",
    "/testback/**/*.py",
    "/testback/reportor/templates/*",
    "/factor_db/*.py",
    "/factor_db/factors/*.py",
    "/data/*.py",
    "/data/db/**/*.py",
    "/configs/*.py",
    "/configs/config.json",
    "/configs/evaluation_splits.json",
    "/configs/strategy.yaml",
]
exclude = ["**/test_*.py"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "network: tests that require network access (e.g., AkShare, CNINFO)",
    "cninfo: tests that require CNINFO API access (stock names, ST status)",
    "qmt: tests that require local QMT/xtdata (K-line history)",
]
