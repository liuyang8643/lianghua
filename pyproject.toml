[project]
name = "wbr"
version = "1.0.0"
description = "WBR Trading System - 基于 QMT 的量化交易系统"
readme = "README.md"
requires-python = "~=3.12.10"
dependencies = [
    "jinja2~=3.1.6",
    "joblib~=1.5.2",
    "lark-oapi~=1.4.23",
    "line-profiler-pycharm~=1.2.0",
    "loguru~=0.7.2",
    "numpy~=2.3.5",
    "pandas~=2.3.3",
    "psutil~=7.1.3",
    "pyarrow~=22.0.0",
    "rich~=14.2.0",
    "ta-lib~=0.6.8",
    "tqdm~=4.67.1",
    "xtquant~=250516.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "trading", "testback", "utils", "configs"]

