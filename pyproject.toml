[project]
name = "wbr"
version = "1.0.0"
description = "WBR Trading System - 基于 QMT 的量化交易系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.14.0",
    "boto3~=1.42.23",
    "deap>=1.4.3",
    "jinja2~=3.1.6",
    "joblib~=1.5.3",
    "lark-oapi~=1.4.23",
    "loguru~=0.7.2",
    "loky~=3.5.6",
    "numpy~=2.3.5",
    "pandas~=2.3.3",
    "psutil~=7.1.3",
    "pyarrow~=22.0.0",
    "pyyaml~=6.0",
    "scipy>=1.16.3",
    "ta-lib~=0.6.8",
    "tqdm>=4.67.1",
    "xtquant~=250516.1.1",
    "plotly~=6.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "trading", "testback", "utils", "configs"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

